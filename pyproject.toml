[project]
name = "ccreport"
version = "0.1.0"
description = "Token usage and cost reporting for Claude Code, plus the status line that reads the same cache"
requires-python = ">=3.13"
# The status line imports none of these — it renders on stdlib alone, which is
# why it can afford to run on every frame. They are ccreport's.
dependencies = [
    "orjson",
    "rich",
]

[project.scripts]
ccreport = "ccreport.ccreport:main"
ccu = "ccreport.ccu:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ccreport"]

# PEP 735 dependency groups — NOT [project.optional-dependencies]
[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "vulture>=2.16",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist[psutil]==3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-testmon>=2.2.0",
    "watchdog>=6.0.0",
]

[tool.ruff]
# 110 rather than the 88 most of these rules assume: the long lines here are
# aligned SQL, rich column definitions and rows of the statusline's env-var
# table, which read as tables until something rewraps them into prose. `just
# fmt` deliberately does not run `ruff format` for the same reason — the
# wrapping in this tree is hand-chosen.
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # McCabe complexity
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle error
  "EM",    # flake8-errmsg
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # Pyflakes
  "FA",    # flake8-future-annotations
  "FBT",   # flake8-boolean-trap
  "FLY",   # flynt
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort (ruff handles import sorting natively)
  "ICN",   # flake8-import-conventions
  "INP",   # flake8-no-pep420
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PIE",   # flake8-pie
  "PL",    # Pylint (PLC, PLE, PLR, PLW)
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific
  "S",     # flake8-bandit (security)
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warning
  "YTT",   # flake8-2020
]
# S608, SLF001 and RUF100 stay on: this tree marks its parameterized-SQL and
# private-access exceptions with `# noqa` at the site, and RUF100 is what keeps
# those markers from outliving the finding.
ignore = [
  # Conflicts inside pydocstyle, or churn from formatting we do not run.
  "COM812",  # trailing commas — no formatter here to add them
  "D203",    # blank line before class docstring (conflicts with D211)
  "D212",    # multi-line summary first line (conflicts with D213)
  "D213",    # multi-line summary second line
  "D413",    # missing blank line after last section
  "D416",    # section name should end with colon

  # Docstrings here carry rationale, not coverage. Requiring one everywhere buys
  # filler: `main()`, a six-field NamedTuple, a one-line property.
  "D101",    # undocumented public class
  "D102",    # undocumented public method
  "D103",    # undocumented public function
  "D105",    # undocumented magic method
  "D107",    # undocumented __init__
  "D400",    # summary must end in a period — several summaries end in a sample
  "D415",    #   of the rendered output ("...ANE:0W"), where a period would read
             #   as part of it
  "D401",    # imperative mood — the docstrings here describe ("Renders ...")

  # Size and shape of the renderers: one branch per status-line segment, one
  # argument per column toggle.
  "C901",    # McCabe complexity
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments
  "PLR0915", # too many statements
  "PLR0917", # too many positional arguments
  "PLR2004", # magic value comparison — thresholds and column widths are values

  # Patterns this tree uses on purpose.
  "PLC0415", # import inside function — a render pays for every top-level import
             # on every invocation, so the heavy ones are deferred
  "EM101",   # string literal in raise
  "EM102",   # f-string in raise
  "TRY003",  # long message outside the exception class — the message *is* the
             #   error at these raise sites; the class has nothing else to say
  "FBT001",  # boolean positional in definition
  "FBT002",  # boolean default positional
  "FBT003",  # boolean positional in call — narrow=/compact= are the whole API
  "G004",    # f-string in logging
  "T201",    # print — these are CLI tools whose output is the product
  "N806",    # uppercase function-local — per-render constants (SEP, DIM, DOT)
  "PLW0603", # global — cache_db holds one connection per process by design
  "PLW1510", # subprocess.run without check — every call site reads returncode
             # itself; check=True would raise where a probe should report
  "PTH109",  # os.getcwd
  "PTH119",  # os.path.basename — differs from Path.name on a trailing slash
  "PTH123",  # open() — the render path allocates no Path it does not need
  "S110",    # try/except/pass
  "SIM105",  # contextlib.suppress instead — cache and snapshot writes are
             #   best-effort: a failed one must not fail the render
  "S603",    # subprocess without a literal argument list
  "S607",    # partial executable path — git/security/macmon/pmset come from PATH
  "PERF401", # manual list comprehension
  "PERF403", # manual dict comprehension — these loops carry guards and comments
             #   a comprehension would bury
  "RUF001",  # ambiguous unicode in string
  "RUF002",  # ambiguous unicode in docstring — the em dash and → are intended
  "SIM102",  # collapsible if — the nested guards carry their own comments
  "SIM108",  # ternary instead of if/else
  "TC003",   # stdlib import into a TYPE_CHECKING block — collections.abc is
             # already loaded, so the block buys nothing and hides the import
  "TRY300",  # return in try — keeps the happy path beside the call it needs
  "TRY301",  # raise within try — the schema guards raise to their own handler
]

[tool.ruff.lint.per-file-ignores]
# Test code is held to a lighter standard than the tool itself:
#   D       — test names document themselves.
#   S       — tests build throwaway trees under /tmp and assert on them.
#   ARG     — fixtures and stub methods take arguments they ignore.
#   PLC0415 — in-test imports keep the module under test out of collection.
#   SLF001  — tests reach into internals on purpose.
#   RUF012  — case tables live in class-level lists, shared by every method.
#   PLW0108 — a monkeypatch lambda mirrors the signature it stands in for.
#   PT011   — the exception type is the assertion; its wording is not a contract.
"tests/*.py" = ["D", "S", "ARG", "PLC0415", "SLF001", "RUF012", "PLW0108", "PT011"]
# tools/ are one-off demos and benchmarks run by hand, not shipped code.
"tools/*.py" = ["D", "S", "ARG", "PLC0415", "SLF001", "INP001", "EXE001"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# standard, not strict. This tree annotates its boundaries and leaves the rest
# inferred; strict wants a parameter type on every local helper and every
# fixture, and answers with a wall of findings that say nothing about
# correctness.
# What standard still catches is the one that bites here: a helper returning
# `dict | None` whose caller subscripts it.
typeCheckingMode = "standard"
stubPath = "./typings"
reportMissingTypeStubs = "none"  # many third-party packages lack type stubs
reportPrivateUsage = "none"  # tests and the CLI reach into _prefixed helpers
deprecateTypingAliases = true
reportUnreachable = true

[tool.vulture]
ignore_decorators = ["@app.route", "@bp.route", "@cli.command"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.py-project-template]
commit = "d042c03cf3a980d7c59e220f8dff40b58a429c23"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
addopts = [
    "--dist=worksteal",
    "-p", "no:pastebin",
    "-p", "no:nose",
    "-p", "no:doctest",
]
