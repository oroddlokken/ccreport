<fieldset class="policy">
  <legend>Push policy</legend>

  <label>Networks
    <input name="networks" autocomplete="off" placeholder="10.0.0.0/8, 192.168.1.0/24">
  </label>
  <p class="hint">Pushes only while this machine holds an address inside one of them. Blank pushes from anywhere.</p>

  <label class="check">
    <input type="checkbox" name="restricted" value="1">
    Hide project names
  </label>
  <div class="dependent">
    <label>Except these projects
      <input name="allow" autocomplete="off" placeholder="ccreport, kantine">
    </label>
    <p class="hint">A hidden project still pushes its counts, under a pseudonym and with no cwd or repo. Blank hides every project.</p>
  </div>
</fieldset>
