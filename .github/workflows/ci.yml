name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The version uv.lock resolves. `just lint-pyright` tracks latest when
      # this is unset, so an upstream release cannot turn main red on its
      # own. Bump it when the lock moves pyright.
      PYRIGHT_PYTHON_FORCE_VERSION: "1.1.411"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs reads the version from the tags.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Set up Python
        run: uv python install 3.13

      # --frozen, as the Dockerfile builds: a uv.lock that drifted from
      # pyproject.toml would otherwise resolve silently to a set nobody ran.
      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Lint
        run: uvx --from rust-just just lint-all

      - name: Test
        run: uv run pytest --timeout 30 -n 8 tests

      # Catches a loosened sdist include-list on the pull request that causes
      # it. publish.yml runs the same check, but only once the merge has landed.
      - name: Check sdist
        run: uvx --from rust-just just check-sdist
