name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  publish:
    # The branch name is the version source, so commits landed any other way
    # publish nothing.
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    env:
      # Same pin as ci.yml, for the same reason.
      PYRIGHT_PYTHON_FORCE_VERSION: "1.1.411"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --frozen

      # These checks run ahead of the tag push, which is the first irreversible
      # step: a failure after it would leave vX.Y.Z on origin with no release.
      - name: Lint
        run: uvx --from rust-just just lint-all

      - name: Test
        run: uv run pytest --timeout 30 -n 8 tests

      - name: Check sdist
        run: uvx --from rust-just just check-sdist

      # The tap push is the last step of a release and the first that needs
      # this token, so its write access is probed here instead. The repo API's
      # permissions.push reports the user's role, which is push for the owner
      # whatever the token itself can do.
      - name: Check tap write access
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -u "x-access-token:${TAP_TOKEN}" \
            "https://github.com/oroddlokken/homebrew-tap.git/info/refs?service=git-receive-pack")
          if [ "$CODE" != "200" ]; then
            echo "HOMEBREW_TAP_TOKEN cannot push to oroddlokken/homebrew-tap (HTTP $CODE)." >&2
            echo "Set the token's Contents permission to Read and write, then rerun." >&2
            exit 1
          fi
          echo "Tap write access confirmed."

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.head_ref }}"
          VERSION="${BRANCH#release/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # hatch-vcs reads the version out of the tag pushed above, so this step
      # cannot move ahead of it.
      - name: Build sdist and wheel
        run: uv build

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BODY=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($0 ~ ver) found=1; next
            }
            found { print }
          ' CHANGELOG.md)
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "ccreport ${{ steps.version.outputs.version }}"
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*.whl
            dist/*.tar.gz

  # After publish, so a failed check cannot ship an image. linux/amd64 alone:
  # nothing runs the server on arm64, and the QEMU leg is the slowest job in
  # a release.
  publish-image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Extract version from branch name
        id: version
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "version=${BRANCH#release/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The OCI labels: version, revision, source and the rest, read off the
      # merge commit. github.repository is already lowercase.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: meta
        run: |
          BRANCH="${{ github.head_ref }}"
          VERSION="${BRANCH#release/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download wheel and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          WHEEL="ccreport-${VERSION}-py3-none-any.whl"
          URL="https://github.com/oroddlokken/ccreport/releases/download/${TAG}/${WHEEL}"
          # The release asset takes a moment to become downloadable. GitHub's
          # 404 body digests to a real sha256, so curl's exit code is what the
          # loop turns on; a digest is never empty enough to retry on.
          for i in 1 2 3 4 5; do
            if curl -fsSL -o wheel.whl "$URL"; then break; fi
            sleep 10
          done
          if [ ! -s wheel.whl ]; then
            echo "$URL never became downloadable. Rerun this job." >&2
            exit 1
          fi
          # An error page can arrive with a 200, and past this step the
          # formula's sha256 is the only thing that would catch it.
          unzip -tq wheel.whl
          SHA256=$(shasum -a 256 wheel.whl | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oroddlokken/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          sed -i 's|url ".*"|url "${{ steps.sha.outputs.url }}"|' Formula/ccreport.rb
          sed -i 's|sha256 ".*"|sha256 "${{ steps.sha.outputs.sha256 }}"|' Formula/ccreport.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ccreport.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ccreport to ${{ steps.meta.outputs.version }}"
          git push
