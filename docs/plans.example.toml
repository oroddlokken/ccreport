# A declared plan history, for `ccreport tiers` and the server's accounts page.
#
# Each entry is the moment a plan started; the one before it ran until then.
# The dates come off the Stripe receipts: an upgrade bills a prorated line the
# day it takes effect, and a downgrade shows up as the line item on the next
# renewal, so the receipt date is the change and the line item is the plan.
#
# `at` is a TOML datetime. A bare date is read as midnight UTC, which is what a
# PDF invoice can honestly say — it carries the day and no clock time.
#
# `account` is a uuid or a login email. It has to name an account the machine
# has already signed in to; one this machine has never seen is skipped, so a
# timeline covering several accounts can be copied to every machine as it is.
#
# Which tier field to fill is what Claude Code's own oauthAccount blob puts the
# value in. A personal Max or Pro plan carries organization_rate_limit_tier
# alone. A team seat carries all three.

# --- personal ---

[[tier]]
at = 2026-02-02T18:00:26Z
account = "me@example.net"
organization_rate_limit_tier = "default_claude_pro"

[[tier]]
at = 2026-02-03T21:03:33Z
account = "me@example.net"
organization_rate_limit_tier = "default_claude_max_5x"

# This one came off a PDF invoice, which carries no clock time.
